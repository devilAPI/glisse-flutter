name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 120 lib test example/lib
      - run: flutter analyze
      - run: flutter test
      - name: Build the gallery for the web
        working-directory: example
        run: flutter build web --release --base-href /glisse-flutter/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: example/build/web

  build:
    name: Build the gallery (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: 17
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Build
        working-directory: example
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "ios" ]; then
            flutter build ios --release --no-codesign
          elif [ "${{ matrix.target }}" = "apk" ]; then
            flutter build apk --release
          else
            flutter build ${{ matrix.target }} --release
          fi

  pages:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

# Publishes to pub.dev when a version tag such as v0.3.0 is pushed.
#
# pub.dev must trust this repository first: publish one version by hand
# (`flutter pub publish`), then on pub.dev open the package's Admin tab and,
# under "Automated publishing", enable GitHub Actions for devilAPI/glisse-flutter
# with the tag pattern `v{{version}}`.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev's OIDC token
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1 # sets up the token flutter pub publish uses
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --force

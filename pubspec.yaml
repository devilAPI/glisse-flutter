name: glisse
description: >-
  Apple's Liquid Glass for Flutter on every platform: refracting glass and
  50+ widgets, from buttons, switches and sliders to pickers, menus and
  sheets. A port of Glisse.
version: 0.5.0
homepage: https://github.com/devilAPI/glisse-flutter
repository: https://github.com/devilAPI/glisse-flutter
issue_tracker: https://github.com/devilAPI/glisse-flutter/issues
documentation: https://devilapi.github.io/glisse-flutter/api/
topics:
  - liquid-glass
  - glassmorphism
  - shader
  - ui
  - widget

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: The gallery on a dark page, with glass buttons and switches over a wallpaper.
    path: doc/desktop_dark.png
  - description: Range slider, wheel pickers and the date and time pickers.
    path: doc/desktop_dark_pickers.png
  - description: Avatars, colour swatches, knobs and the calendar.
    path: doc/desktop_dark_extras.png
  - description: Glass controls on a light page.
    path: doc/desktop_light_controls.png

flutter:
  shaders:
    - shaders/glass.frag
